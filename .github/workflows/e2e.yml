name: E2E tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Scheduled workflows only run from the default branch. This Academy
  # workflow is stored in a reference tag, so the trigger remains disabled.
  # Enable it in a project workflow on the default branch:
  # schedule:
  #   - cron: '0 3 * * *'

jobs:
  stable:
    uses: shopware/github-actions/.github/workflows/e2e.yml@main
    with:
      extensionName: ${{ github.event.repository.name }}
      e2ePath: tests/acceptance
      e2eTestFramework: playwright
      shopwareVersion: v6.7.16.0

